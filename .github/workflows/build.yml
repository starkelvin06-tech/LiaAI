name: Build Lia AI APKs

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Both Flavors (Direct & Play)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Assemble Debug APKs (Direct & Play)
        run: ./gradlew assembleDirectDebug assemblePlayDebug --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDirectDebugUnitTest testPlayDebugUnitTest --stacktrace || true

      - name: Upload Direct Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LiaAI-direct-debug
          path: app/build/outputs/apk/direct/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Play Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LiaAI-play-debug
          path: app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
